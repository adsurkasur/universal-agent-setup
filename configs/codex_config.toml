model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
personality = "pragmatic"
service_tier = "default"

[desktop]
conversationDetailMode = "STEPS_PROSE"
sansFontSize = 14
codeFontSize = 13
ambient-suggestions-enabled = true
followUpQueueMode = "queue"

[windows]
sandbox = "elevated"

[mcp_servers.drawio]
command = "npx"
args = ["-y", "@drawio/mcp"]

[mcp_servers.ripple]
command = "npx"
args = ["-y", "@ytsuda/ripple@latest"]

[mcp_servers.android-emulator]
command = "npx"
args = ["-y", "mcp-android-emulator"]

[mcp_servers.android-emulator.env]
ADB_PATH = "__ANDROID_ADB_PATH__"
ANDROID_HOME = "__ANDROID_HOME__"
ANDROID_SDK_ROOT = "__ANDROID_HOME__"

[mcp_servers.arduino]
command = "npx"
args = ["-y", "arduino-mcp-server"]

[mcp_servers.arduino.env]
ARDUINO_CLI_PATH = "__ARDUINO_CLI_PATH__"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.better-icons]
command = "npx"
args = ["-y", "better-icons"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--executablePath", "__BROWSER_PATH__"]

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "__GITHUB_PERSONAL_ACCESS_TOKEN__"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]


[mcp_servers.play-console]
command = "cmd.exe"
args = ["/d", "/c", "npx", "-y", "@orellbuehler/play-console-mcp@0.3.1"]

[mcp_servers.play-console.env]
GOOGLE_SERVICE_ACCOUNT_KEY_PATH = "__GOOGLE_PLAY_KEY_PATH__"
